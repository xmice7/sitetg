<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Розклад занять</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Змінні кольорів: беремо з теми Telegram, якщо є, інакше дефолтні темні */
            --bg-color: var(--tg-theme-bg-color, #121212);
            --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
            --text-main: var(--tg-theme-text-color, #ffffff);
            --text-hint: var(--tg-theme-hint-color, #aaaaaa);
            --accent: var(--tg-theme-button-color, #6ab2f2);
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 20px;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            position: sticky;
            top: 0;
            background-color: var(--bg-color);
            z-index: 10;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
        }

        /* Вибір підгрупи */
        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        /* Вкладки */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-hint);
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* Контент розкладу */
        .schedule-container {
            padding: 16px;
        }

        .day-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .day-subheader {
            font-size: 13px;
            color: var(--text-hint);
            margin-bottom: 16px;
        }

        /* Картка пари */
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 16px;
        }

        .time-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            min-width: 50px;
        }
        .time-col .line {
            color: var(--text-hint);
            margin: 2px 0;
            font-weight: 400;
        }

        .info-col {
            flex: 1;
        }

        .lesson-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .lesson-teacher {
            font-size: 13px;
            color: var(--text-hint);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            background-color: rgba(106, 178, 242, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-hint);
            padding: 40px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn" onclick="window.Telegram.WebApp.close()">✖</button>
        <div class="header-title">Розклад занять</div>
        <select id="group-select" onchange="renderSchedule()">
            <option value="all">Усі підгрупи</option>
            <option value="1">Підгрупа 1</option>
            <option value="2">Підгрупа 2</option>
        </select>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="setTab('today')" id="tab-today">📅 На сьогодні</div>
        <div class="tab" onclick="setTab('tomorrow')" id="tab-tomorrow">📅 На завтра</div>
        <div class="tab" onclick="setTab('week')" id="tab-week">🗓 На цей тиждень</div>
    </div>

    <main class="schedule-container" id="schedule-container">
        </main>

    <script>
        // Ініціалізація Telegram
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ================== НАЛАШТУВАННЯ ЧАСУ ==================
        const BASE_MONDAY = "2024-02-05"; // Зміни на потрібний базовий понеділок
        const BASE_WEEK_TYPE = "numerator"; // "numerator" або "denominator"
        let currentTab = 'today';

        // ================== ДАНІ РОЗКЛАДУ ==================
        const SCHEDULE = {
            numerator: {
                mon: [
                    { start: "08:30", end: "09:50", title: "Операційні системи, системне програмування (Лаб)", teacher: "доц. Бойко Я. В.", room: "N10/Б", group: 1 },
                    { start: "08:30", end: "09:50", title: "Веб-технології та програмування (ч.1) (Лаб)", teacher: "доц. Анохін В. Є.", room: "№5/Б", group: 2 },
                    { start: "10:10", end: "11:30", title: "Веб-технології та програмування (ч.1) (Лаб)", teacher: "доц. Анохін В. Є.", room: "№5/Б", group: 1 },
                    { start: "10:10", end: "11:30", title: "Операційні системи, системне програмування (Лаб)", teacher: "доц. Бойко Я. В.", room: "N10/Б", group: 2 },
                    { start: "11:50", end: "13:10", title: "Українська мова (ПрС)", teacher: "доц. Збір І. М.", room: "129а/Т" },
                ],
                tue: [
                    { start: "08:30", end: "09:50", title: "Іноземна мова (ПрС)", teacher: "ас. Шумська О. А.", room: "3/Б", potik: true },
                    { start: "10:10", end: "11:30", title: "Об’єктно-орієнтоване програмування (Лаб)", teacher: "ас. Левуш П. Н.", room: "N12/Т", group: 1 },
                    { start: "10:10", end: "11:30", title: "Дискретна математика (Лаб)", teacher: "доц. Середницька Х. І.", room: "324/Т", group: 2 },
                    { start: "11:50", end: "13:10", title: "Вища математика (Л)", teacher: "доц. Жумік О. В.", room: "130/Т", potik: true },
                    { start: "13:30", end: "14:50", title: "Об’єктно-орієнтоване програмування (Лаб)", teacher: "ас. Левуш П. Н.", room: "№6/Т", group: 2 },
                ],
                wed: [
                    { start: "10:10", end: "11:30", title: "Філософія (Л)", teacher: "доц. Лосік О. М.", room: "2/Б", potik: true },
                    { start: "11:50", end: "13:10", title: "Веб-технології та програмування (ч.1) (Л)", teacher: "ас. Чмихало О. С.", room: "1/Б", potik: true },
                    { start: "13:30", end: "14:50", title: "Операційні системи, системне програмування (Л)", teacher: "доц. Бойко Я. В.", room: "2/Б", potik: true },
                ],
                thu: [
                    { start: "08:30", end: "09:50", title: "Іноземна мова (ПрС)", teacher: "ас. Шумська О. А.", room: "3/Б", potik: true },
                    { start: "10:10", end: "11:30", title: "Вища математика (ПрС)", teacher: "доц. Жумік О. В.", room: "407/Т" },
                ],
                fri: [
                    { start: "10:10", end: "11:30", title: "Об’єктно-орієнтоване програмування (Л)", teacher: "доц. Кушнір О. О.", room: "130/Т", potik: true },
                    { start: "11:50", end: "13:10", title: "Дискретна математика (Л)", teacher: "доц. Середницька Х. І.", room: "130/Т", potik: true },
                    { start: "13:30", end: "14:50", title: "Дискретна математика (Лаб)", teacher: "доц. Середницька Х. І.", room: "№6/Т", group: 1 },
                ],
            },
            denominator: {
                mon: [
                    { start: "08:30", end: "09:50", title: "Операційні системи, системне програмування (Лаб)", teacher: "доц. Бойко Я. В.", room: "N10/Б", group: 1 },
                    { start: "08:30", end: "09:50", title: "Веб-технології та програмування (ч.1) (Лаб)", teacher: "доц. Анохін В. Є.", room: "№5/Б", group: 2 },
                    { start: "10:10", end: "11:30", title: "Веб-технології та програмування (ч.1) (Лаб)", teacher: "доц. Анохін В. Є.", room: "№5/Б", group: 1 },
                    { start: "10:10", end: "11:30", title: "Операційні системи, системне програмування (Лаб)", teacher: "доц. Бойко Я. В.", room: "N10/Б", group: 2 },
                    { start: "11:50", end: "13:10", title: "Українська мова (Л)", teacher: "доц. Фарина Н. Г.", room: "2/Б", potik: true },
                    { start: "13:30", end: "14:50", title: "Філософія (ПрС)", teacher: "доц. Бартусяк П. М.", room: "204/Б" },
                ],
                tue: [
                    { start: "08:30", end: "09:50", title: "Іноземна мова (ПрС)", teacher: "ас. Шумська О. А.", room: "3/Б", potik: true },
                    { start: "10:10", end: "11:30", title: "Об’єктно-орієнтоване програмування (Лаб)", teacher: "ас. Левуш П. Н.", room: "N12/Т", group: 1 },
                    { start: "10:10", end: "11:30", title: "Дискретна математика (Лаб)", teacher: "доц. Середницька Х. І.", room: "324/Т", group: 2 },
                    { start: "11:50", end: "13:10", title: "Вища математика (Л)", teacher: "доц. Жумік О. В.", room: "130/Т", potik: true },
                    { start: "13:30", end: "14:50", title: "Об’єктно-орієнтоване програмування (Лаб)", teacher: "ас. Левуш П. Н.", room: "№6/Т", group: 2 },
                ],
                wed: [
                    { start: "11:50", end: "13:10", title: "Веб-технології та програмування (ч.1) (Л)", teacher: "ас. Чмихало О. С.", room: "1/Б", potik: true },
                    { start: "13:30", end: "14:50", title: "Операційні системи, системне програмування (Л)", teacher: "доц. Бойко Я. В.", room: "2/Б", potik: true },
                ],
                thu: [
                    { start: "08:30", end: "09:50", title: "Іноземна мова (ПрС)", teacher: "ас. Шумська О. А.", room: "3/Б", potik: true },
                    { start: "10:10", end: "11:30", title: "Вища математика (ПрС)", teacher: "доц. Жумік О. В.", room: "407/Т" },
                ],
                fri: [
                    { start: "10:10", end: "11:30", title: "Об’єктно-орієнтоване програмування (Л)", teacher: "доц. Кушнір О. О.", room: "130/Т", potik: true },
                    { start: "11:50", end: "13:10", title: "Дискретна математика (Л)", teacher: "доц. Середницька Х. І.", room: "130/Т", potik: true },
                    { start: "13:30", end: "14:50", title: "Дискретна математика (Лаб)", teacher: "доц. Середницька Х. І.", room: "№6/Т", group: 1 },
                ],
            }
        };

        // ================== ЛОГІКА ==================
        const UA_DAYS = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "Пʼятниця", "Субота"];
        const UA_MONTHS = ["січ.", "лют.", "бер.", "квіт.", "трав.", "черв.", "лип.", "серп.", "вер.", "жовт.", "лист.", "груд."];
        const DAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];

        function getWeekType(dateObj) {
            const baseMon = new Date(BASE_MONDAY);
            const thisDay = new Date(dateObj);
            // Знаходимо понеділок поточного тижня
            const day = thisDay.getDay();
            const diffToMonday = day === 0 ? -6 : 1 - day;
            thisDay.setDate(thisDay.getDate() + diffToMonday);
            thisDay.setHours(0,0,0,0);
            
            const diffTime = Math.abs(thisDay - baseMon);
            const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
            
            return diffWeeks % 2 === 0 ? BASE_WEEK_TYPE : (BASE_WEEK_TYPE === "numerator" ? "denominator" : "numerator");
        }

        function formatDateHeader(dateObj) {
            const dayName = UA_DAYS[dateObj.getDay()];
            const dateNum = dateObj.getDate();
            const monthName = UA_MONTHS[dateObj.getMonth()];
            return `${dayName}, ${dateNum} ${monthName}`;
        }

        function extractType(title) {
            if (title.includes("(Лаб)")) return "🧪 Лаб";
            if (title.includes("(ПрС)")) return "📚 ПрС";
            if (title.includes("(Л)")) return "🎤 Лекція";
            return "📝 Заняття";
        }

        function cleanTitle(title) {
            return title.replace(/\s*\((Лаб|ПрС|Л)\)/g, '').trim();
        }

        function buildCardHtml(lesson) {
            const type = extractType(lesson.title);
            const clean = cleanTitle(lesson.title);
            
            let badgesHTML = `<span class="badge">${type}</span>`;
            if (lesson.room) {
                badgesHTML += `<span class="badge">🚪 ${lesson.room}</span>`;
            }
            if (lesson.potik) {
                badgesHTML += `<span class="badge">👥 Потік</span>`;
            } else if (lesson.group) {
                badgesHTML += `<span class="badge">👥 Підгр. ${lesson.group}</span>`;
            }

            return `
                <div class="card">
                    <div class="time-col">
                        <span class="time">${lesson.start}</span>
                        <span class="line">—</span>
                        <span class="time">${lesson.end}</span>
                    </div>
                    <div class="info-col">
                        <div class="lesson-title">${clean}</div>
                        <div class="lesson-teacher">${lesson.teacher || 'Викладач не вказаний'}</div>
                        <div class="badges">
                            ${badgesHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDay(dateObj) {
            const dayKey = DAY_KEYS[dateObj.getDay()];
            const weekType = getWeekType(dateObj);
            const typeLabel = weekType === "numerator" ? "Чисельник" : "Знаменник";
            
            let html = `
                <div class="day-header">${formatDateHeader(dateObj)}</div>
                <div class="day-subheader">🔄 ${typeLabel}</div>
            `;

            if (dayKey === 'sun' || dayKey === 'sat') {
                html += `<div class="empty-state">🎉 Вихідний день! Пар немає.</div>`;
                return html;
            }

            let lessons = SCHEDULE[weekType][dayKey] || [];
            const pref = document.getElementById('group-select').value;
            
            if (pref !== 'all') {
                lessons = lessons.filter(l => !l.group || l.group == pref);
            }

            if (lessons.length === 0) {
                html += `<div class="empty-state">Пар немає.</div>`;
            } else {
                lessons.forEach(l => {
                    html += buildCardHtml(l);
                });
            }

            return html;
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            const today = new Date(); // Локальний час пристрою

            if (currentTab === 'today') {
                container.innerHTML = renderDay(today);
            } 
            else if (currentTab === 'tomorrow') {
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                container.innerHTML = renderDay(tomorrow);
            } 
            else if (currentTab === 'week') {
                // Починаємо з понеділка поточного тижня
                const startOfWeek = new Date(today);
                const day = startOfWeek.getDay();
                const diff = startOfWeek.getDate() - day + (day === 0 ? -6 : 1);
                startOfWeek.setDate(diff);

                let weekHtml = '';
                for (let i = 0; i < 5; i++) { // Тільки ПН-ПТ
                    const d = new Date(startOfWeek);
                    d.setDate(d.getDate() + i);
                    weekHtml += renderDay(d) + '<br>';
                }
                container.innerHTML = weekHtml;
            }
        }

        function setTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            renderSchedule();
        }

        // Перший рендер
        renderSchedule();
    </script>
</body>
</html>
