<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">

    <title>Розклад ФЕП-13</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Змінні для світлої теми */
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-green: #059669;
            --bg-green: #d1fae5;
            --accent-purple: #7c3aed;
            --bg-purple: #ede9fe;
            --bg-blue: #dbeafe;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Змінні для темної теми */
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --accent-green: #10b981;
            --bg-green: rgba(16, 185, 129, 0.15);
            --accent-purple: #a78bfa;
            --bg-purple: rgba(139, 92, 246, 0.15);
            --bg-blue: rgba(59, 130, 246, 0.15);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; padding-bottom: 40px; transition: background-color 0.3s ease, color 0.3s ease; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; }

        /* Header & Theme Toggle */
        header { text-align: center; margin-bottom: 24px; position: relative; padding-top: 10px; }
        header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { color: var(--text-muted); font-size: 14px; text-transform: capitalize; font-weight: 500; }

        .theme-toggle { position: absolute; top: 5px; right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); box-shadow: var(--shadow); transition: all 0.2s ease; }
        .theme-toggle:hover { transform: scale(1.05); }
        .theme-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* Controls */
        .controls { display: flex; margin-bottom: 24px; }
        .select-wrapper { flex: 1; position: relative; }
        .select-wrapper select { width: 100%; appearance: none; background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 14px 18px; border-radius: 14px; font-size: 15px; font-weight: 600; outline: none; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow); }
        .select-wrapper select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .select-wrapper::after { content: "▼"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-muted); pointer-events: none; }

        /* Days Tabs */
        .days-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
        .days-nav::-webkit-scrollbar { display: none; }
        .day-btn { background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; box-shadow: var(--shadow); }
        .day-btn:hover { border-color: var(--text-muted); }
        .day-btn.active { background-color: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }

        /* Schedule List & Headers */
        .schedule-list { display: flex; flex-direction: column; gap: 14px; }
        .day-header { display: flex; justify-content: space-between; align-items: flex-end; margin: 20px 0 8px 0; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
        .day-header .day-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .day-header .week-badge { font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--bg-card); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); }

        /* Lesson Card */
        .lesson-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; gap: 16px; transition: all 0.3s ease; box-shadow: var(--shadow); position: relative; }
        .lesson-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--primary); }

        /* Підсвітка поточної пари */
        .lesson-card.current-lesson { border-color: var(--accent-green); box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3), var(--shadow); }
        [data-theme="dark"] .lesson-card.current-lesson { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.5), var(--shadow); }
        
        .current-badge { position: absolute; top: -12px; right: 16px; background: var(--accent-green); color: #fff; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px; z-index: 10; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .time-block { min-width: 65px; text-align: center; border-right: 2px dashed var(--border); padding-right: 16px; display: flex; flex-direction: column; justify-content: center; }
        .time-start { font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .time-end { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-top: 4px; }

        .info-block { flex: 1; }
        .lesson-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; line-height: 1.4; color: var(--text-main); }
        .lesson-meta { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .lesson-meta svg { width: 16px; height: 16px; fill: currentColor; opacity: 0.8; }

        /* Badges */
        .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-group { background-color: var(--bg-green); color: var(--accent-green); }
        .badge-type { background-color: var(--bg-purple); color: var(--accent-purple); }
        .badge-potik { background-color: var(--bg-blue); color: var(--primary); }

        .empty-state span { font-size: 40px; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 16px; font-weight: 600; }
    </style>
</head>

function getLocalMonday(d) {
    const dInfo = new Date(d);
    const day = dInfo.getDay() === 0 ? 7 : dInfo.getDay();
    dInfo.setDate(dInfo.getDate() - day + 1);
    dInfo.setHours(0, 0, 0, 0);
    return dInfo;
}

function getWeekType(dateObj) {
    const localMonday = getLocalMonday(dateObj);
    const utcCurrent = Date.UTC(localMonday.getFullYear(), localMonday.getMonth(), localMonday.getDate());
    const diffDays = Math.floor((utcCurrent - BASE_MONDAY_UTC) / (1000 * 60 * 60 * 24));
    const diffWeeks = Math.floor(diffDays / 7);
    return (diffWeeks % 2 === 0) ? BASE_WEEK_TYPE : (BASE_WEEK_TYPE === 'numerator' ? 'denominator' : 'numerator');
}

function init() {
    const todayKyiv = getKyivDate();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    els.dateDisplay.textContent = todayKyiv.toLocaleDateString('uk-UA', options);
    
    els.groupSelect.value = state.group;

    els.groupSelect.addEventListener('change', (e) => { 
        state.group = e.target.value; 
        localStorage.setItem('fep13_saved_group', state.group);
        render(); 
    });
    
    els.daysNav.addEventListener('click', (e) => {
        if(e.target.classList.contains('day-btn')) {
            state.tab = e.target.dataset.tab;
            render();
        }
    });

    render();

    // Авто-оновлення для підсвічування кожної хвилини
    setInterval(() => {
        if (state.tab === 'today' || state.tab === 'this_week') render();
    }, 60000);
}

function parseTitle(rawTitle) {
    let cleanTitle = rawTitle.replace(/\s*\(Потік\)/g, "").trim();
    let type = "";
    if(cleanTitle.includes('(Л)')) { type = "Лекція"; cleanTitle = cleanTitle.replace('(Л)', ''); }
    else if(cleanTitle.includes('(Лаб)')) { type = "Лабораторна"; cleanTitle = cleanTitle.replace('(Лаб)', ''); }
    else if(cleanTitle.includes('(ПрС)')) { type = "Практична"; cleanTitle = cleanTitle.replace('(ПрС)', ''); }
    const isPotik = rawTitle.includes('(Потік)');
    return { title: cleanTitle.trim(), type, isPotik };
}

function renderDayBlock(targetDate, showHeader = true) {

    const kyivNow = getKyivDate();

                        targetDate.getFullYear() === kyivNow.getFullYear();
    const currentMins = kyivNow.getHours() * 60 + kyivNow.getMinutes();

    }

    if (dayIndex === 0 || dayIndex === 6) {
        html += `<div class="empty-state"><span>🎉</span><p>Ура, вихідний!</p></div>`;
        return html;
    }

    const dayLessons = SCHEDULE[weekType][dayKey] || [];
    const filtered = dayLessons.filter(lesson => {
        if (state.group === 'all') return true;
        if (!lesson.group) return true;
        return lesson.group.toString() === state.group;
    });

    if (filtered.length === 0) {
        html += `<div class="empty-state"><span>🙌</span><p>На цей день пар немає</p></div>`;
        return html;
    }

    html += filtered.map(lesson => {
        const { title, type, isPotik } = parseTitle(lesson.title);
        const cleanTeacher = lesson.teacher.replace(/\s*\(Потік\)/g, "").trim();
        
        // Логіка підсвічування "Триває зараз"
        let isCurrent = false;
        if (isTodayKyiv) {
            const [sh, sm] = lesson.start.split(':').map(Number);
            const [eh, em] = lesson.end.split(':').map(Number);
            const startMins = sh * 60 + sm;
            const endMins = eh * 60 + em;
            if (currentMins >= startMins && currentMins <= endMins) {
                isCurrent = true;
            }
        }

        let badges = '';
        if(type) badges += `<span class="badge badge-type">${type}</span>`;
        if(lesson.group) badges += `<span class="badge badge-group">Підгрупа ${lesson.group}</span>`;
        if(isPotik || lesson.teacher.includes('(Потік)')) badges += `<span class="badge badge-potik">Потік</span>`;

        const cardClasses = isCurrent ? "lesson-card current-lesson" : "lesson-card";
        const currentBadgeHTML = isCurrent ? `<div class="current-badge">Триває зараз</div>` : '';

        return `
            <div class="${cardClasses}">
                ${currentBadgeHTML}
                <div class="time-block">
                    <span class="time-start">${lesson.start}</span>
                    <span class="time-end">${lesson.end}</span>
                </div>
                <div class="info-block">
                    ${badges ? `<div class="badges">${badges}</div>` : ''}
                    <h3 class="lesson-title">${title}</h3>
                    ${lesson.room ? `<div class="lesson-meta">${ICONS.room} <span>${lesson.room}</span></div>` : ''}
                    ${cleanTeacher ? `<div class="lesson-meta">${ICONS.teacher} <span>${cleanTeacher}</span></div>` : ''}
                </div>
            </div>
        `;
    }).join('');

    return html;
}

function render() {
    document.querySelectorAll('.day-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === state.tab);
    });

    let contentHTML = '';
    const nowKyiv = getKyivDate();

    if (state.tab === 'today') {
        contentHTML = renderDayBlock(nowKyiv, true);
    } 
    else if (state.tab === 'tomorrow') {
        const tomorrow = new Date(nowKyiv);
        tomorrow.setDate(tomorrow.getDate() + 1);
        contentHTML = renderDayBlock(tomorrow, true);
    } 
    else if (state.tab === 'this_week') {
        const mon = getLocalMonday(nowKyiv);
        for(let i=0; i<5; i++) { 
            const d = new Date(mon);
            d.setDate(d.getDate() + i);
            contentHTML += renderDayBlock(d, true);
        }
    } 
    else if (state.tab === 'next_week') {
        const nextMon = getLocalMonday(nowKyiv);
        nextMon.setDate(nextMon.getDate() + 7);
        for(let i=0; i<5; i++) {
            const d = new Date(nextMon);
            d.setDate(d.getDate() + i);
            contentHTML += renderDayBlock(d, true);
        }
    }

    els.scheduleContainer.innerHTML = contentHTML;
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
