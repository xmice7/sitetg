<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <title>Розклад ФЕП-13</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Змінні для світлої теми */
        :root {
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-green: #059669;
            --bg-green: #d1fae5;
            --accent-purple: #7c3aed;
            --bg-purple: #ede9fe;
            --bg-blue: #dbeafe;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --modal-bg: rgba(255, 255, 255, 0.95);
        }

        /* Змінні для темної теми */
        [data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --accent-green: #10b981;
            --bg-green: rgba(16, 185, 129, 0.15);
            --accent-purple: #a78bfa;
            --bg-purple: rgba(139, 92, 246, 0.15);
            --bg-blue: rgba(59, 130, 246, 0.15);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            --modal-bg: rgba(30, 41, 59, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; padding-bottom: 40px; transition: background-color 0.3s ease, color 0.3s ease; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; }

        /* Header & Settings Button */
        header { text-align: center; margin-bottom: 24px; position: relative; padding-top: 10px; }
        header h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; color: var(--primary); transition: color 0.3s ease; }
        header p { color: var(--text-muted); font-size: 14px; text-transform: capitalize; font-weight: 500; }

        .settings-btn { position: absolute; top: 5px; right: 0; background: var(--bg-card); border: 1px solid var(--border); border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); box-shadow: var(--shadow); transition: all 0.2s ease; }
        .settings-btn:hover { transform: rotate(45deg); color: var(--primary); border-color: var(--primary); }
        .settings-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* Controls */
        .controls { display: flex; margin-bottom: 24px; }
        .select-wrapper { flex: 1; position: relative; }
        .select-wrapper select { width: 100%; appearance: none; background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 14px 18px; border-radius: 14px; font-size: 15px; font-weight: 600; outline: none; cursor: pointer; transition: all 0.2s ease; box-shadow: var(--shadow); }
        .select-wrapper select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .select-wrapper::after { content: "▼"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--text-muted); pointer-events: none; }

        /* Days Tabs */
        .days-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; scrollbar-width: none; }
        .days-nav::-webkit-scrollbar { display: none; }
        .day-btn { background-color: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s ease; box-shadow: var(--shadow); }
        .day-btn.active { background-color: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }

        /* Schedule List & Headers */
        .schedule-list { display: flex; flex-direction: column; gap: 14px; }
        .day-header { display: flex; justify-content: space-between; align-items: flex-end; margin: 20px 0 8px 0; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
        .day-header .day-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
        .day-header .week-badge { font-size: 12px; font-weight: 600; color: var(--text-muted); background: var(--bg-card); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); }

        /* Lesson Card */
        .lesson-card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; gap: 16px; transition: all 0.3s ease; box-shadow: var(--shadow); position: relative; overflow: hidden; }
        
        /* Підсвітка поточної пари */
        .lesson-card.current-lesson { border-color: var(--accent-green); border-width: 2px; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15); padding-bottom: 24px; }
        .current-badge { position: absolute; top: -1px; right: 16px; background: var(--accent-green); color: #fff; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 0 0 8px 8px; text-transform: uppercase; letter-spacing: 0.5px; z-index: 10; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        /* Підсвітка наступної пари (перерва) */
        .lesson-card.next-lesson { border-color: var(--primary); border-width: 2px; }
        .next-badge { position: absolute; top: -1px; right: 16px; background: var(--primary); color: #fff; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 0 0 8px 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .time-block { min-width: 60px; text-align: center; border-right: 2px dashed var(--border); padding-right: 12px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
        .time-start { font-size: 18px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
        .time-end { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-top: 4px; }

        .info-block { flex: 1; z-index: 2; }
        .lesson-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; color: var(--text-main); }
        .lesson-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
        .lesson-meta svg { width: 14px; height: 14px; fill: currentColor; opacity: 0.8; }

        /* Badges */
        .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .badge { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-group { background-color: var(--bg-green); color: var(--accent-green); }
        .badge-type { background-color: var(--bg-purple); color: var(--accent-purple); }
        .badge-potik { background-color: var(--bg-blue); color: var(--primary); }

        /* Live Timer UI */
        .live-timer-wrapper { position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--border); z-index: 1; }
        .live-timer-progress { height: 100%; background: var(--accent-green); width: 0%; transition: width 1s linear; }
        .live-timer-text { font-size: 12px; font-weight: 700; color: var(--accent-green); margin-top: 8px; display: flex; align-items: center; gap: 6px; }
        .live-timer-text svg { width: 14px; height: 14px; animation: spin 2s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* All Done Message */
        .all-done-message { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 16px; margin-top: 8px; box-shadow: var(--shadow); flex-wrap: wrap; animation: slideUp 0.5s ease; position: relative; overflow: hidden; }
        .all-done-message::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent-green); border-radius: 16px 0 0 16px; }
        .all-done-icon { font-size: 24px; background: var(--bg-green); width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
        .all-done-text { flex: 1; min-width: 150px; }
        .all-done-text h4 { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 2px; }
        .all-done-text p { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .go-tomorrow-btn { background: var(--primary); color: #fff; border: none; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); display: flex; align-items: center; gap: 6px; margin-left: auto; }
        .go-tomorrow-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Empty State */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--bg-card); border-radius: 16px; border: 2px dashed var(--border); }
        .empty-state span { font-size: 40px; display: block; margin-bottom: 12px; }

        /* --- SETTINGS MODAL --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; display: flex; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content { background: var(--modal-bg); width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 24px; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-top: 1px solid var(--border); box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h2 { font-size: 20px; font-weight: 800; }
        .close-btn { background: var(--border); border: none; width: 32px; height: 32px; border-radius: 50%; color: var(--text-main); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }

        .setting-group { margin-bottom: 20px; }
        .setting-group label { display: block; font-size: 14px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* Color Picker */
        .color-picker { display: flex; gap: 12px; margin-top: 8px; }
        .color-circle { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; position: relative; }
        .color-circle.active { border-color: var(--text-main); transform: scale(1.1); }
        .color-circle::after { content: "✓"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 14px; opacity: 0; font-weight: bold; }
        .color-circle.active::after { opacity: 1; }

        /* Theme Switcher in Modal */
        .theme-switch { display: flex; background: var(--bg-body); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
        .theme-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .theme-btn.active { background: var(--bg-card); color: var(--text-main); box-shadow: var(--shadow); }
        .theme-btn svg { width: 16px; height: 16px; fill: currentColor; }
    </style>
</head>

            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>

function timeToSeconds(timeStr) { const [h, m] = timeStr.split(':').map(Number); return h * 3600 + m * 60; }
function formatTimeLeft(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h > 0 ? h + ':' : ''}${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

function applyColor(colorKey) {
    const c = colors[colorKey];
    htmlEl.style.setProperty('--primary', c.main);
    htmlEl.style.setProperty('--primary-hover', c.hover);
    htmlEl.style.setProperty('--bg-blue', c.light);
}

function renderColorPicker() {
    const picker = document.getElementById('color-picker');
    picker.innerHTML = Object.keys(colors).map(key => 
        `<div class="color-circle ${state.color === key ? 'active' : ''}" style="background-color: ${colors[key].main}" data-color="${key}"></div>`
    ).join('');
    
    picker.querySelectorAll('.color-circle').forEach(circle => {
        circle.addEventListener('click', () => {
            state.color = circle.dataset.color;
            localStorage.setItem('fep13_color', state.color);
            applyColor(state.color);
            renderColorPicker();
        });
    });
}

function init() {
    const todayKyiv = getKyivDate();
    els.dateDisplay.textContent = todayKyiv.toLocaleDateString('uk-UA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    els.groupSelect.value = state.group;
    els.engSelect.value = state.engTeacher;
    updateThemeUI();
    renderColorPicker();

    els.groupSelect.addEventListener('change', (e) => { state.group = e.target.value; localStorage.setItem('fep13_saved_group', state.group); render(); });
    els.engSelect.addEventListener('change', (e) => { state.engTeacher = e.target.value; localStorage.setItem('fep13_eng_teacher', state.engTeacher); render(); });
    
    els.daysNav.addEventListener('click', (e) => { if(e.target.classList.contains('day-btn')) { state.tab = e.target.dataset.tab; render(); }});
    
    els.settingsBtn.addEventListener('click', () => els.modal.classList.add('active'));
    els.closeBtn.addEventListener('click', () => els.modal.classList.remove('active'));
    els.modal.addEventListener('click', (e) => { if(e.target === els.modal) els.modal.classList.remove('active'); });

    els.themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            state.theme = btn.dataset.themeVal;
            htmlEl.setAttribute('data-theme', state.theme);
            localStorage.setItem('fep13_theme', state.theme);
            updateThemeUI();
        });

    render();
    setInterval(updateLiveTimers, 1000);
}

function updateThemeUI() {
    els.themeBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.themeVal === state.theme);
    });
}

function getLocalMonday(d) {
    const dInfo = new Date(d);
    const day = dInfo.getDay() === 0 ? 7 : dInfo.getDay();
    dInfo.setDate(dInfo.getDate() - day + 1);
    dInfo.setHours(0, 0, 0, 0);
    return dInfo;
}

function getWeekType(dateObj) {
    const localMonday = getLocalMonday(dateObj);
    const utcCurrent = Date.UTC(localMonday.getFullYear(), localMonday.getMonth(), localMonday.getDate());
    const diffDays = Math.floor((utcCurrent - BASE_MONDAY_UTC) / (1000 * 60 * 60 * 24));
    const diffWeeks = Math.floor(diffDays / 7);
    return (diffWeeks % 2 === 0) ? BASE_WEEK_TYPE : (BASE_WEEK_TYPE === 'numerator' ? 'denominator' : 'numerator');
}

function parseTitle(rawTitle) {
    let cleanTitle = rawTitle.replace(/\s*\(Потік\)/g, "").trim();
    let type = "";
    if(cleanTitle.includes('(Л)')) { type = "Лекція"; cleanTitle = cleanTitle.replace('(Л)', ''); }
    else if(cleanTitle.includes('(Лаб)')) { type = "Лабораторна"; cleanTitle = cleanTitle.replace('(Лаб)', ''); }
    else if(cleanTitle.includes('(ПрС)')) { type = "Практична"; cleanTitle = cleanTitle.replace('(ПрС)', ''); }
    return { title: cleanTitle.trim(), type, isPotik: rawTitle.includes('(Потік)') };
}

function renderDayBlock(targetDate, showHeader = true) {
    const dayIndex = targetDate.getDay();
    const dayKey = jsDaysMap[dayIndex];
    const weekType = getWeekType(targetDate);
    const kyivNow = getKyivDate();
    
    const isTodayKyiv = targetDate.getDate() === kyivNow.getDate() && targetDate.getMonth() === kyivNow.getMonth() && targetDate.getFullYear() === kyivNow.getFullYear();
    const nowSecs = kyivNow.getHours() * 3600 + kyivNow.getMinutes() * 60 + kyivNow.getSeconds();

    let html = '';

    if (showHeader) {
        const dateStr = `${targetDate.getDate()} ${monthNames[targetDate.getMonth()]}`;
        const wTypeName = weekType === 'numerator' ? '🔁 Чисельник' : '🔁 Знаменник';
        html += `<div class="day-header"><span class="day-title">${uaDays[dayIndex]}, ${dateStr}</span><span class="week-badge">${wTypeName}</span></div>`;
    }

    if (dayIndex === 0 || dayIndex === 6) return html + `<div class="empty-state"><span>🎉</span><p>Ура, вихідний!</p></div>`;

    let dayLessons = SCHEDULE[weekType][dayKey] || [];
    
    let filtered = dayLessons.filter(lesson => {
        if (state.group !== 'all' && lesson.group && lesson.group.toString() !== state.group) return false;
        if (lesson.isEng && state.engTeacher !== 'all' && !lesson.teacher.includes(state.engTeacher)) return false;
        return true;
    });

    if (filtered.length === 0) return html + `<div class="empty-state"><span>🙌</span><p>На цей день пар немає</p></div>`;

    let currentLessonId = null;
    let nextLessonId = null;

    if (isTodayKyiv) {
        for (let i = 0; i < filtered.length; i++) {
            const l = filtered[i];
            const startS = timeToSeconds(l.start);
            const endS = timeToSeconds(l.end);
            
            if (nowSecs >= startS && nowSecs <= endS) {
                currentLessonId = i; break;
            } else if (nowSecs < startS && nextLessonId === null) {
                nextLessonId = i;
            }
        }
    }

    html += filtered.map((lesson, idx) => {
        const { title, type, isPotik } = parseTitle(lesson.title);
        const cleanTeacher = lesson.teacher.replace(/\s*\(Потік\)/g, "").trim();
        
        let badges = '';
        if(type) badges += `<span class="badge badge-type">${type}</span>`;
        if(lesson.group) badges += `<span class="badge badge-group">Підгрупа ${lesson.group}</span>`;
        if(isPotik || lesson.teacher.includes('(Потік)')) badges += `<span class="badge badge-potik">Потік</span>`;
        if(lesson.isEng && state.engTeacher === 'all') badges += `<span class="badge badge-group">Збірна група</span>`;

        let extraHTML = '';
        let cardClasses = "lesson-card";
        let timerData = '';

        if (idx === currentLessonId) {
            cardClasses += " current-lesson";
            extraHTML = `
                <div class="current-badge">Триває зараз</div>
                <div class="live-timer-text">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                    До кінця: <span id="live-time-val">--:--</span>
                </div>
                <div class="live-timer-wrapper"><div class="live-timer-progress" id="live-progress-bar"></div></div>
            `;
            timerData = `data-start="${timeToSeconds(lesson.start)}" data-end="${timeToSeconds(lesson.end)}" id="tracked-current"`;
        } else if (idx === nextLessonId) {
            cardClasses += " next-lesson";
            extraHTML = `<div class="next-badge" id="tracked-next" data-start="${timeToSeconds(lesson.start)}">Почнеться через --:--</div>`;
        }

        return `
            <div class="${cardClasses}" ${timerData}>
                ${extraHTML.includes('current-badge') ? '<div class="current-badge">Триває зараз</div>' : ''}
                ${extraHTML.includes('next-badge') ? extraHTML : ''}
                <div style="display: flex; width: 100%; gap: 16px;">
                    <div class="time-block">
                        <span class="time-start">${lesson.start}</span>
                        <span class="time-end">${lesson.end}</span>
                    </div>
                    <div class="info-block">
                        ${badges ? `<div class="badges">${badges}</div>` : ''}
                        <h3 class="lesson-title">${title}</h3>
                        ${lesson.room ? `<div class="lesson-meta">${ICONS.room} <span>${lesson.room}</span></div>` : ''}
                        ${cleanTeacher ? `<div class="lesson-meta">${ICONS.teacher} <span>${cleanTeacher}</span></div>` : ''}
                        ${extraHTML.includes('live-timer-text') ? '<div class="live-timer-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> До кінця: <span id="live-time-val">--:--</span></div>' : ''}
                    </div>
                </div>
                ${extraHTML.includes('live-timer-wrapper') ? '<div class="live-timer-wrapper"><div class="live-timer-progress" id="live-progress-bar"></div></div>' : ''}
            </div>
        `;
    }).join('');

    // БЛОК "НА СЬОГОДНІ ВСЕ"
    if (isTodayKyiv) {
        const lastLesson = filtered[filtered.length - 1];
        const lastEndS = timeToSeconds(lastLesson.end);
        
        if (nowSecs > lastEndS) {
            html += `
                <div class="all-done-message">
                    <div class="all-done-icon">🎉</div>
                    <div class="all-done-text">
                        <h4>На сьогодні все!</h4>
                        <p>Всі пари успішно завершено. Можна відпочивати.</p>
                    </div>
                    <button class="go-tomorrow-btn" onclick="document.querySelector('[data-tab=\\'tomorrow\\']').click()">
                        На завтра <svg style="width:16px; height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            `;
        }
    }

    return html;
}

function render() {
    document.querySelectorAll('.day-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === state.tab));

    let contentHTML = '';
    const nowKyiv = getKyivDate();

    if (state.tab === 'today') contentHTML = renderDayBlock(nowKyiv, true);
    else if (state.tab === 'tomorrow') { const t = new Date(nowKyiv); t.setDate(t.getDate() + 1); contentHTML = renderDayBlock(t, true); }
    else if (state.tab === 'this_week') { const m = getLocalMonday(nowKyiv); for(let i=0; i<5; i++) { const d = new Date(m); d.setDate(d.getDate() + i); contentHTML += renderDayBlock(d, true); } }
    else if (state.tab === 'next_week') { const nm = getLocalMonday(nowKyiv); nm.setDate(nm.getDate() + 7); for(let i=0; i<5; i++) { const d = new Date(nm); d.setDate(d.getDate() + i); contentHTML += renderDayBlock(d, true); } }

    els.scheduleContainer.innerHTML = contentHTML;
    updateLiveTimers(); 
}

function updateLiveTimers() {
    if (state.tab !== 'today') return;

    const now = getKyivDate();
    const nowSecs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    const currentCard = document.getElementById('tracked-current');
    if (currentCard) {
        const start = parseInt(currentCard.dataset.start);
        const end = parseInt(currentCard.dataset.end);
        
        if (nowSecs > end) {
            render(); 
            return;
        }

        const totalDuration = end - start;
        const elapsed = nowSecs - start;
        const remaining = end - nowSecs;
        
        const progressPercent = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
        
        const timeValEl = document.getElementById('live-time-val');
        const progressBarEl = document.getElementById('live-progress-bar');
        
        if (timeValEl) timeValEl.textContent = formatTimeLeft(remaining);
        if (progressBarEl) progressBarEl.style.width = `${progressPercent}%`;
    }

    const nextBadge = document.getElementById('tracked-next');
    if (nextBadge) {
        const start = parseInt(nextBadge.dataset.start);
        
        if (nowSecs >= start) {
            render(); 
            return;
        }

        const remaining = start - nowSecs;
        nextBadge.textContent = `Почнеться через ${formatTimeLeft(remaining)}`;
    }
}
